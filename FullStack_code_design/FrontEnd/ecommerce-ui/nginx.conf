# ╔══════════════════════════════════════════════════════════════╗
# ║   Nginx Config — Production SPA + API Proxy                  ║
# ╚══════════════════════════════════════════════════════════════╝
#
# SYSTEM DESIGN: Nginx responsibilities in production:
#   1. Serve Angular static files (HTML/JS/CSS) from dist/
#   2. Proxy /api/* → Spring Boot (removes CORS issues entirely)
#   3. SPA fallback: unknown routes → index.html (Angular handles routing)
#   4. Gzip compression: reduces transfer size by ~70%
#   5. Cache-Control headers: tell browser to cache assets aggressively

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────
    # SYSTEM DESIGN: compresses responses — JS bundles go from 300KB → 90KB
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── Static asset caching ─────────────────────────────────────
    # Hashed filenames (main-K5QIJ6NK.js) never change → cache forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API Proxy ────────────────────────────────────────────────
    # SYSTEM DESIGN: proxy eliminates browser CORS issues
    # Angular calls /api/v1/products → Nginx forwards to Spring Boot
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SPA Fallback ──────────────────────────────────────────────
    # For routes like /products/123 — Angular Router handles them
    # without this, Nginx would 404 on direct URL access
    location / {
        try_files $uri $uri/ /index.html;
    }
}
